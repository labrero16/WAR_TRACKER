# fly.toml app configuration file generated for war-tracker on 2026-11-02T19:21:07Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'war-tracker'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'off'
  force_https = true
  internal_port = 8080
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
